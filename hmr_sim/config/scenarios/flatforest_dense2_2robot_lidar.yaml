# Two-robot LIDAR-ONLY scenario for the VERY DENSE flatforest world.
#
# Identical to flatforest_dense_2robot_lidar.yaml except the world (400
# stems/ha); transmit power stays 30 dBm. Re-measure the unknown-fraction floor
# before any coverage-terminated run: it rises with occlusion.
# (notes: scenario-flatforest-dense2-2robot)
# Moved comments: docs/hmr_sim_code_notes.md
world: flatforest_dense2

robots:
  - name: atlas
    sdf_file: COSTAR_HUSKY_SENSOR_CONFIG_LIDAR/model.sdf
    features: [lidar, imu, odom_gt, ugv_cmd_vel]
    pose: {x: 0.0, y: 0.0, z: 0.5, yaw: 0.0}

  - name: bestla
    sdf_file: COSTAR_HUSKY_SENSOR_CONFIG_LIDAR/model.sdf
    features: [lidar, imu, odom_gt, ugv_cmd_vel]
    pose: {x: 0.0, y: 3.0, z: 0.5, yaw: 3.14159}

teleop:
  enable: false

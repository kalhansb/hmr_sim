# 3-robot LIDAR-ONLY scenario for the CMU forest stand with the buildings
# removed (world cmu_forest_nb).
#
# Identical to cmu_forest_3robot_lidar.yaml except the world: cmu_forest with
# its three house models deleted, nothing else changed. For coverage termination
# here use done_unknown_fraction 0.58, not 0.64.
# (notes: scenario-cmu-forest-nb-3robot)
# Moved comments: docs/hmr_sim_code_notes.md
world: cmu_forest_nb

robots:
  - name: atlas
    sdf_file: COSTAR_HUSKY_SENSOR_CONFIG_LIDAR/model.sdf
    features: [lidar, imu, odom_gt, ugv_cmd_vel]
    pose: {x: 0.0, y: 0.0, z: 0.5, yaw: 0.0}

  - name: bestla
    sdf_file: COSTAR_HUSKY_SENSOR_CONFIG_LIDAR/model.sdf
    features: [lidar, imu, odom_gt, ugv_cmd_vel]
    pose: {x: 0.0, y: 3.0, z: 0.5, yaw: 3.14159}

  - name: husky
    sdf_file: COSTAR_HUSKY_SENSOR_CONFIG_LIDAR/model.sdf
    features: [lidar, imu, odom_gt, ugv_cmd_vel]
    pose: {x: 0.0, y: -3.0, z: 0.5, yaw: 0.0}

teleop:
  enable: false

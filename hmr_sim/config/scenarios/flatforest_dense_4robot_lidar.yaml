# Four-robot LIDAR-ONLY scenario for the DENSE flatforest world.
#
# flatforest_dense_3robot_lidar.yaml plus skadi at y=+6, earlier poses
# unchanged; the team must start connected. Record achieved RTF per team size:
# CPU contention shows up as comms behaviour.
# (notes: scenario-flatforest-dense-4robot)
# Moved comments: docs/hmr_sim_code_notes.md
world: flatforest_dense

robots:
  - name: atlas
    sdf_file: COSTAR_HUSKY_SENSOR_CONFIG_LIDAR/model.sdf
    features: [lidar, imu, odom_gt, ugv_cmd_vel]
    pose: {x: 0.0, y: 0.0, z: 0.5, yaw: 0.0}

  - name: bestla
    sdf_file: COSTAR_HUSKY_SENSOR_CONFIG_LIDAR/model.sdf
    features: [lidar, imu, odom_gt, ugv_cmd_vel]
    pose: {x: 0.0, y: 3.0, z: 0.5, yaw: 3.14159}

  - name: husky
    sdf_file: COSTAR_HUSKY_SENSOR_CONFIG_LIDAR/model.sdf
    features: [lidar, imu, odom_gt, ugv_cmd_vel]
    pose: {x: 0.0, y: -3.0, z: 0.5, yaw: 0.0}

  - name: skadi
    sdf_file: COSTAR_HUSKY_SENSOR_CONFIG_LIDAR/model.sdf
    features: [lidar, imu, odom_gt, ugv_cmd_vel]
    pose: {x: 0.0, y: 6.0, z: 0.5, yaw: 3.14159}

teleop:
  enable: false

# Three-robot LIDAR-ONLY scenario for the CMU forest world.
#
# Identical to flatforest_dense_3robot_lidar.yaml except the world, and to
# cmu_forest_2robot_lidar.yaml plus husky at y=-3. The team must start
# connected. Re-measure the unknown-fraction floor before coverage-terminated
# runs. (notes: scenario-cmu-forest-3robot)
# Moved comments: docs/hmr_sim_code_notes.md
world: cmu_forest

robots:
  - name: atlas
    sdf_file: COSTAR_HUSKY_SENSOR_CONFIG_LIDAR/model.sdf
    features: [lidar, imu, odom_gt, ugv_cmd_vel]
    pose: {x: 0.0, y: 0.0, z: 0.5, yaw: 0.0}

  - name: bestla
    sdf_file: COSTAR_HUSKY_SENSOR_CONFIG_LIDAR/model.sdf
    features: [lidar, imu, odom_gt, ugv_cmd_vel]
    pose: {x: 0.0, y: 3.0, z: 0.5, yaw: 3.14159}

  - name: husky
    sdf_file: COSTAR_HUSKY_SENSOR_CONFIG_LIDAR/model.sdf
    features: [lidar, imu, odom_gt, ugv_cmd_vel]
    pose: {x: 0.0, y: -3.0, z: 0.5, yaw: 0.0}

teleop:
  enable: false

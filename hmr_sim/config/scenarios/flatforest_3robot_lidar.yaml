# Three-robot LIDAR-ONLY scenario for the flatforest world.
#
# flatforest_2robot_lidar.yaml plus husky at y=-3, all three on
# COSTAR_HUSKY_SENSOR_CONFIG_LIDAR; atlas and bestla keep their poses. The team
# must start connected: comms warm-up and planner peer discovery assume it.
# (notes: scenario-flatforest-3robot)
# Moved comments: docs/hmr_sim_code_notes.md
world: flatforest

robots:
  - name: atlas
    sdf_file: COSTAR_HUSKY_SENSOR_CONFIG_LIDAR/model.sdf
    features: [lidar, imu, odom_gt, ugv_cmd_vel]
    pose: {x: 0.0, y: 0.0, z: 0.5, yaw: 0.0}

  - name: bestla
    sdf_file: COSTAR_HUSKY_SENSOR_CONFIG_LIDAR/model.sdf
    features: [lidar, imu, odom_gt, ugv_cmd_vel]
    pose: {x: 0.0, y: 3.0, z: 0.5, yaw: 3.14159}

  - name: husky
    sdf_file: COSTAR_HUSKY_SENSOR_CONFIG_LIDAR/model.sdf
    features: [lidar, imu, odom_gt, ugv_cmd_vel]
    pose: {x: 0.0, y: -3.0, z: 0.5, yaw: 0.0}

teleop:
  enable: false

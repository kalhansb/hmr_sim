# Two-robot LIDAR-ONLY scenario for the flatforest world.
#
# Both robots use COSTAR_HUSKY_SENSOR_CONFIG_LIDAR (lidar and IMU, no cameras),
# overriding the registry defaults. The features list drives the ros_gz bridge
# topics for each robot. (notes: scenario-flatforest-2robot)
# Moved comments: docs/hmr_sim_code_notes.md
world: flatforest

robots:
  - name: atlas
    sdf_file: COSTAR_HUSKY_SENSOR_CONFIG_LIDAR/model.sdf
    features: [lidar, imu, odom_gt, ugv_cmd_vel]
    pose: {x: 0.0, y: 0.0, z: 0.5, yaw: 0.0}

  - name: bestla
    sdf_file: COSTAR_HUSKY_SENSOR_CONFIG_LIDAR/model.sdf
    features: [lidar, imu, odom_gt, ugv_cmd_vel]
    pose: {x: 0.0, y: 3.0, z: 0.5, yaw: 3.14159}

teleop:
  enable: false

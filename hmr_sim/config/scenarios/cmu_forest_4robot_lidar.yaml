# Four-robot LIDAR-ONLY scenario for the CMU forest world.
#
# Identical to flatforest_dense_4robot_lidar.yaml except the world; adds skadi
# at y=+6. These poses override the registry's default_spawn_points. Re-measure
# the unknown-fraction floor before coverage-terminated runs.
# (notes: scenario-cmu-forest-4robot)
# Moved comments: docs/hmr_sim_code_notes.md
world: cmu_forest

robots:
  - name: atlas
    sdf_file: COSTAR_HUSKY_SENSOR_CONFIG_LIDAR/model.sdf
    features: [lidar, imu, odom_gt, ugv_cmd_vel]
    pose: {x: 0.0, y: 0.0, z: 0.5, yaw: 0.0}

  - name: bestla
    sdf_file: COSTAR_HUSKY_SENSOR_CONFIG_LIDAR/model.sdf
    features: [lidar, imu, odom_gt, ugv_cmd_vel]
    pose: {x: 0.0, y: 3.0, z: 0.5, yaw: 3.14159}

  - name: husky
    sdf_file: COSTAR_HUSKY_SENSOR_CONFIG_LIDAR/model.sdf
    features: [lidar, imu, odom_gt, ugv_cmd_vel]
    pose: {x: 0.0, y: -3.0, z: 0.5, yaw: 0.0}

  - name: skadi
    sdf_file: COSTAR_HUSKY_SENSOR_CONFIG_LIDAR/model.sdf
    features: [lidar, imu, odom_gt, ugv_cmd_vel]
    pose: {x: 0.0, y: 6.0, z: 0.5, yaw: 3.14159}

teleop:
  enable: false

# Four-robot LIDAR-ONLY scenario for the patchy flatforest world (final paper, 2026-10-19).
#
# flatforest_patchy_3robot_lidar.yaml plus skadi at y=+6, earlier poses
# unchanged (the same fourth spawn as flatforest_dense_open_4robot_lidar.yaml); the
# team must start connected. Nearest trunk to (0, 6) is Oak tree_dense_189 at 9.20 m
# (make_flatforest_patchy.py keeps every tree >= 6 m from every spawn, (0, 6) included).
world: flatforest_patchy

robots:
  - name: atlas
    sdf_file: COSTAR_HUSKY_SENSOR_CONFIG_LIDAR/model.sdf
    features: [lidar, imu, odom_gt, ugv_cmd_vel]
    pose: {x: 0.0, y: 0.0, z: 0.5, yaw: 0.0}

  - name: bestla
    sdf_file: COSTAR_HUSKY_SENSOR_CONFIG_LIDAR/model.sdf
    features: [lidar, imu, odom_gt, ugv_cmd_vel]
    pose: {x: 0.0, y: 3.0, z: 0.5, yaw: 3.14159}

  - name: husky
    sdf_file: COSTAR_HUSKY_SENSOR_CONFIG_LIDAR/model.sdf
    features: [lidar, imu, odom_gt, ugv_cmd_vel]
    pose: {x: 0.0, y: -3.0, z: 0.5, yaw: 0.0}

  - name: skadi
    sdf_file: COSTAR_HUSKY_SENSOR_CONFIG_LIDAR/model.sdf
    features: [lidar, imu, odom_gt, ugv_cmd_vel]
    pose: {x: 0.0, y: 6.0, z: 0.5, yaw: 3.14159}

teleop:
  enable: false

# Parameters for hmr_comms_sim_node — the message-level wireless-link emulator.
# robot_names, world_sdf and use_sim_time are normally injected by
# comms_sim.launch.py (from the scenario yaml / world registry); anything here
# can also be overridden per run with --ros-args -p.
#
# See docs/comms_sim.md for the model and the reliable/best-effort semantics.
# Moved comments: docs/comms_sim_params_notes.md
hmr_comms_sim:
  ros__parameters:
    # Where each robot's pose comes from; '{robot}' is replaced per robot.
    # Any nav_msgs/Odometry source works — GT odom in sim, replayed odom from a bag.
    pose_topic_pattern: "/{robot}/odom_ground_truth"

    # Topics relayed with the "reliable" policy: never dropped, queued while the
    # link is down and delivered late at the link's bandwidth. Use for the
    # scovox delta stream — a silently dropped delta permanently holes the
    # receiver's merged map, which would confound the map-merging experiments.
    reliable_topics: ["scovox_node/scovox_bin"]

    # Topics relayed with the "latest" policy: reliable, but a new message
    # removes any older one from the same sender still queued for that
    # receiver (drop_superseded; a message on the air is never cancelled). For
    # streams whose every message is a whole state: the full-map frames of the
    # gen-34 full-map arm (DESIGN_gen34 §12), switched on per run by
    # comms_sim.launch.py map_stream:=full. Empty entries are ignored, so [""]
    # is an empty list.
    latest_topics: [""]

    # Topics relayed with the "best-effort" policy: dropped when the link is
    # down, when the shared channel is out of airtime, or by the per-message
    # BER coin flip. Use for streams where the latest sample supersedes older
    # ones (pointclouds, odometry). e.g. ["velodyne_points"]
    #
    # Needs the planner's coord_intent_pub_topic/coord_intent_sub_topics and
    # team_beacon_pub_topic/team_beacon_sub_topics, else no relay forms. List
    # only topics the running node publishes: one nobody publishes stays
    # pending for the whole run, so the discovery poll never stops, "All relay
    # topics discovered" never prints, and after pending_warn_sec the emulator
    # warns. gen 33's exploration/team_world is off this list; a gen-33 run
    # would add it back in its own params file. Never reliable: a late
    # message resets peer TTL.
    # (notes: comms-best-effort-intents-team-world)
    best_effort_topics: ["exploration/intents", "exploration/team_beacon"]

    # Seconds a listed topic may stay undiscovered after the last topic that
    # was discovered (or after the first poll, if none was) before the
    # emulator warns, once, naming it. Discovery keeps polling after the
    # warning, so a late publisher is still relayed. <= 0 disables the warning.
    pending_warn_sec: 120.0

    # --- radio / propagation (forest model, IEEE 9260568) -------------------
    tx_power_dbm: 30.0        # matches the old RobotNetworkConfig default
    noise_floor_dbm: -101.0   # 802.11n
    p0_db: 49.17              # path loss at 1 m
    # Attenuation per trunk crossing the Fresnel zone; 70 dB makes a single tree
    # fatal. Runs at another value are a different radio regime: never pool
    # across it. (notes: comms-tree-attenuation-70db)
    tree_attenuation_db: 70.0
    # Hard radio horizon (3D distance). Beyond it the node adds a 200 dB cliff,
    # so even a tree-free link is down — free-space loss alone keeps a 30 dBm
    # link decodable for kilometres. <= 0 disables the cap.
    max_range_m: 30.0
    tree_radius_m: 0.3
    frequency_hz: 2.4e9
    fade_sigma_db: 4.8        # shadow-fading std (stationary)
    fade_alpha: 0.9           # AR(1) memory per link tick; higher = slower fading
    # A model counts as a tree if its name or include URI contains any entry
    # (case-insensitive); unlisted species are transparent to the radio. Shrubs
    # are excluded on purpose. To match nothing write [""], never [].
    # (notes: comms-tree-name-substrings)
    tree_name_substrings: ["tree", "pine", "pinus", "oak", "euca", "ulex"]
    # Superseded scalar. If set non-empty it REPLACES the list above and warns.
    # It is not a bit-for-bit revert: include URIs are now matched too, so even
    # the legacy "tree" finds the pines via model://cmu_pine_tree.
    # tree_name_substring: "tree"

    # --- link dynamics ------------------------------------------------------
    link_rate_hz: 5.0         # link model tick; SNR hysteresis spans 8 ticks (1.6 s)
    delay_ms: 2.5             # propagation+stack latency added to every delivery

    # --- shared channel -----------------------------------------------------
    # All links contend for one channel: airtime_capacity seconds of air per
    # second. A message of B bytes on a link at R Mbps costs 8B/R seconds.
    #
    # 0.6 allows for 802.11 protocol overhead and the 0.25 s burst for interface
    # buffering; neither is calibrated against a measured radio. One global
    # bucket: no spatial reuse between distant pairs.
    # (notes: comms-airtime-capacity-burst)
    airtime_capacity: 0.6
    airtime_burst_s: 0.25     # max accumulated idle airtime (burst allowance)
    retx_cap: 4.0             # cap on the reliable retransmission cost factor
    # true: best-effort messages skip the airtime admission check (they are
    # still charged, so they slow the reliable queues). Gen 34 runs set it from
    # the run script so the small team beacon survives a map backlog.
    best_effort_priority: false

    # --- reliable backlog bound --------------------------------------------
    reliable_queue_max_bytes: 67108864  # 64 MiB per directional link

    # rx publisher history depth. Must be deeper than any expected reconnect
    # burst (backlog drains near-instantly for small messages): a reliable
    # KeepLast publisher silently replaces unacked samples past its depth.
    # Receivers should subscribe with a comparable depth.
    #
    # Applied to both the source subscription and the rx publisher, unbounded in
    # bytes. dscovox_node's scovox_bin_qos_depth must match or the burst is
    # dropped at the reader. Size as worst_outage_s * share_rate_hz * margin.
    # (notes: comms-rx-qos-depth)
    rx_qos_depth: 4000
    # Depth for latest topics instead (source subscription and rx publisher).
    # Each message supersedes the last, and a ~10 MB map frame times 4000 is
    # memory no run has.
    latest_qos_depth: 2

    # admission: a queued reliable/latest message is admitted whole at the
    # tier in force and delivered at now + bits/tier, whatever the link does
    # next (every run before gen-34 §12). progressive: one message on the air
    # per directional link, sent at the current tier each delivery tick,
    # delivered FIFO when complete; a latest message cut by a link drop is
    # aborted. The runner sets it per run (TX_MODEL); see DESIGN_gen34 §12.12.
    transmission_model: admission

    # --- reproducibility ----------------------------------------------------
    seed: 42                  # link fading is a pure function of (seed, tick)

    stats_period_s: 10.0

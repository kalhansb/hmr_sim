# Radio profile NEUTRAL: the DEFAULT and the main-ladder profile
# (DESIGN_radio_v2.md §2.14, "Which profile runs what", Kalhan 2026-09-29).
# Every value is the mean of the published values; sources in §2.14's table.
# Any override of a value here is a new radio regime (the node's radio_regime
# hash changes); never pool across regimes.
hmr_comms_sim:
  ros__parameters:
    # §2.14 propagation, then §13's 802.11n PHY and analytic MAC. The MAC keys
    # (mac_*, minstrel_*) keep radio_mac.hpp's defaults, listed in ~/radio_regime.
    radio_stack: v2_phy
    radio_profile: neutral
    fade_mode: counter       # per-link fade, a pure function of (seed, link, tick)
    ground_model: two_ray    # d_b = 4 h_t h_r / lambda (5.12 m at 0.4/0.4 m)
    frequency_hz: 2.4e9
    # Radio (§2.8, §2.14, §13): typical 802.11n. Budget 114 dB to the 4 dB
    # preamble-detection threshold (§13; §2.14 quoted 116 dB to MCS0 at 2 dB).
    tx_power_dbm: 20.0
    tx_gain_dbi: 2.0
    rx_gain_dbi: 2.0
    noise_figure_db: 7.0
    bandwidth_hz: 20.0e6
    # p0 at 1 m, antenna gains excluded: mean of Azevedo's no-tree intercept
    # (40.1, = free space) and Botella-Campos's measured 54.17 [4], [36].
    p0_db: 47.1
    # P.833 woodland at 2.4 GHz: mean of Fig. 2 (0.49) and Table 1 extrapolated
    # (0.38) [1]. gamma_bg = this minus the measured explicit mean.
    gamma_itu_db_m: 0.44
    # A_m, lateral-wave cap: mean of the Mulhouse (32.7) and St Petersburg (36.0)
    # fits at 2400 MHz [1] §2.1.
    veg_max_atten_db: 34.4
    # gamma_u through a bush, shrub top below / above the link line [30], [31], §2.11.
    bush_gamma_low_db_m: 0.5
    bush_gamma_high_db_m: 1.5
    antenna_height_m: 0.4    # deck-mounted (Kalhan 2026-09-27)
    # AR(1) fade [4]. sigma: review finding 1 (variance budget) is still open.
    fade_sigma_db: 4.4
    fade_alpha: 0.9
    max_range_m: 0.0         # v2 has no hard horizon: range comes from the physics

# Radio profile PESSIMISTIC: the sensitivity check, run on at least one full rung
# (DESIGN_radio_v2.md §2.14, "Which profile runs what", Kalhan 2026-09-29).
# Each value is the reasonable maximum of the published values; §2.14 table.
# Any override of a value here is a new radio regime (the node's radio_regime
# hash changes); never pool across regimes.
hmr_comms_sim:
  ros__parameters:
    radio_stack: v2_prop     # §2.14 propagation on v1's rate tiers and airtime
    radio_profile: pessimistic
    fade_mode: counter       # per-link fade, a pure function of (seed, link, tick)
    ground_model: two_ray    # d_b = 4 h_t h_r / lambda (5.12 m at 0.4/0.4 m)
    frequency_hz: 2.4e9
    # Radio (§2.8, §2.14): typical 802.11n, MCS0 at 2 dB SNR, budget 116 dB.
    tx_power_dbm: 20.0
    tx_gain_dbi: 2.0
    rx_gain_dbi: 2.0
    noise_figure_db: 7.0
    bandwidth_hz: 20.0e6
    # p0 at 1 m, antenna gains excluded: Botella-Campos's measured 54.17 [36]
    # (the RSSI of -30.67 dBm at 1 m with the laptop's 5 dBi gain taken out).
    p0_db: 54.17
    # P.833 woodland at 2.4 GHz: Fig. 2, the higher of the two readings [1].
    # gamma_bg = this minus the measured explicit mean.
    gamma_itu_db_m: 0.49
    # A_m: the higher temperate fit, St Petersburg, at 2400 MHz [1] §2.1. Rio
    # (62.7) is excluded: tropical, fitted over 900-1800 MHz only.
    veg_max_atten_db: 36.0
    # gamma_u through a bush, shrub top below / above the link line [30], [31], §2.11.
    bush_gamma_low_db_m: 0.5
    bush_gamma_high_db_m: 1.5
    antenna_height_m: 0.4    # deck-mounted (Kalhan 2026-09-27)
    # AR(1) fade [4]. sigma: review finding 1 (variance budget) is still open.
    fade_sigma_db: 4.4
    fade_alpha: 0.9
    max_range_m: 0.0         # v2 has no hard horizon: range comes from the physics
